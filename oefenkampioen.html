<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oefenkampioen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg: #EDF3FF;
    --card: #FFFFFF;
    --card-2: #F7F9FF;
    --ink: #1F2A44;
    --ink-soft: #66739B;
    --line: #DCE3F7;
    --accent: #FF7A45;
    --accent-ink: #FFFFFF;
    --hand-hour: #2B3A67;
    --hand-min: #FF7A45;
    --good: #12A06B;
    --good-bg: #DFF6EC;
    --bad: #DB4545;
    --bad-bg: #FDE6E6;
    --gold: #FFC43D;
    --screen: #16203A;
    --screen-ink: #7FE7FF;
    --shadow: 0 6px 0 rgba(43,58,103,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121A2C;
      --card: #1D2740;
      --card-2: #232F4D;
      --ink: #EDF2FF;
      --ink-soft: #9AA7CE;
      --line: #33405F;
      --accent: #FF9160;
      --accent-ink: #1B2337;
      --hand-hour: #CBD7FA;
      --hand-min: #FF9160;
      --good: #35D69B;
      --good-bg: #163B31;
      --bad: #FF7B7B;
      --bad-bg: #40222A;
      --gold: #FFD166;
      --screen: #0B1220;
      --screen-ink: #7FE7FF;
      --shadow: 0 6px 0 rgba(0,0,0,.35);
    }
  }

  * { box-sizing: border-box; }
  /* zonder deze regel verliest het hidden-attribuut van een flex-container zijn werking */
  [hidden] { display: none !important; }
  /* niets in dikke letters: dik leest minder makkelijk dan normaal */
  h1, h2, h3, b, strong { font-weight: normal; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Nunito, "Segoe UI", system-ui, sans-serif;
    font-weight: normal;
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 18px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 {
    font-family: Fredoka, Nunito, sans-serif;
    font-weight: normal;
    font-size: clamp(24px, 6vw, 32px);
    margin: 0;
    flex: 1 1 auto;
    text-wrap: balance;
    letter-spacing: -.01em;
  }
  h1 .tick { color: var(--accent); }
  .icon-btn {
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 999px;
    width: 42px; height: 42px;
    font-size: 19px;
    cursor: pointer;
    line-height: 1;
    flex: none;
  }
  .lead { margin: 0; color: var(--ink-soft); font-size: 15px; }
  #startScherm, #menuScherm { display: flex; flex-direction: column; gap: 14px; }
  .naamkaart {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 20px;
    padding: 12px 16px;
  }
  .naamkaart label, .kaartlabel { font-family: Fredoka, sans-serif; font-size: 16px; }
  .aantallen { display: flex; gap: 8px; flex-wrap: wrap; }
  .aantal {
    font-family: Fredoka, sans-serif;
    font-size: 16px;
    border: 2px solid var(--line);
    background: var(--card-2);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
  }
  .aantal[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }
  .naamkaart input {
    flex: 1 1 140px;
    min-width: 0;
    font-family: Fredoka, sans-serif;
    font-size: 17px;
    color: var(--ink);
    background: var(--card-2);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 8px 12px;
  }
  .naamkaart input::placeholder { color: var(--ink-soft); }

  /* spellen en hoofdstukken delen dezelfde kaart */
  .menu { display: flex; flex-direction: column; gap: 10px; }
  .hfd {
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 22px;
    padding: 14px 16px;
    cursor: pointer;
    font-family: Nunito, sans-serif;
    color: var(--ink);
    box-shadow: var(--shadow);
    transition: transform .1s;
  }
  .hfd:active { transform: translateY(4px); box-shadow: none; }
  .hfd .ico {
    flex: none;
    width: 50px; height: 50px;
    border-radius: 16px;
    background: var(--card-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .hfd .tekst { flex: 1 1 auto; min-width: 0; }
  .hfd h2 { font-family: Fredoka, sans-serif; font-size: 18px; margin: 0; }
  .hfd p { margin: 2px 0 0; font-size: 14px; color: var(--ink-soft); }
  .badge {
    flex: none;
    font-family: Fredoka, sans-serif;
    font-size: 12px;
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
  }
  .badge.makkelijk { background: var(--good-bg); color: var(--good); }
  .badge.gemiddeld { background: var(--gold); color: #3A2B00; }
  .badge.moeilijk  { background: var(--bad-bg); color: var(--bad); }
  .beste {
    flex: none;
    font-family: Fredoka, sans-serif;
    font-size: 13px;
    color: var(--good);
    white-space: nowrap;
  }

  /* spelscherm */
  .scorebar { display: flex; align-items: center; gap: 10px; }
  .score-badge {
    font-family: Fredoka, sans-serif;
    background: var(--gold);
    color: #3A2B00;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 17px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .scorebar .titel {
    flex: 1 1 auto;
    font-family: Fredoka, sans-serif;
    font-size: 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .dots { display: grid; gap: 6px; }
  .dot {
    min-width: 0;
    height: 26px;
    border-radius: 9px;
    background: var(--line);
    border: 2px solid transparent;
    color: var(--ink-soft);
    font-family: Fredoka, sans-serif;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
    transition: background .2s;
  }
  .dot.good { background: var(--good); color: var(--bg); }
  .dot.bad  { background: var(--bad);  color: var(--bg); }
  .dot.now  { background: transparent; border-color: var(--accent); color: var(--accent); }

  /* het doek: elk spel tekent hier zijn eigen ding */
  .doek {
    position: relative;
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 28px;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    overflow: hidden;
    min-height: 200px;
  }
  /* wat een spel tekent kan uit meerdere stukken bestaan: klok, pijl, klok */
  #doek {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
  }
  .party { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti { position: absolute; top: -10px; font-size: 22px; animation: fall 1.3s ease-in forwards; }
  @keyframes fall { to { transform: translateY(330px) rotate(340deg); opacity: 0; } }
  .tempobalk {
    height: 10px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
  }
  .tempobalk span {
    display: block;
    height: 100%;
    background: var(--accent);
    transform-origin: left center;
  }
  @keyframes leeglopen { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  .stempel {
    font-family: Fredoka, sans-serif;
    font-size: 22px;
    color: var(--ink-soft);
    display: flex; align-items: center; gap: 8px;
  }

  /* klok */
  svg.clock { width: min(280px, 72vw); height: auto; max-width: 100%; display: block; }
  svg.klein { width: min(140px, 34vw); }
  .pijl { font-size: 26px; flex: none; }
  .hand { transition: transform .75s cubic-bezier(.22,1.4,.4,1); transform-origin: 100px 100px; }

  /* monster */
  svg.monster { width: min(215px, 54vw); height: auto; display: block; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  svg.monster.gevangen { animation: vangst .7s ease-in forwards; }
  @keyframes vangst { to { transform: scale(.12) rotate(28deg); opacity: 0; } }
  svg.monster.mis { animation: mis .4s; }
  @keyframes mis { 25% { transform: translateX(-11px); } 75% { transform: translateX(11px); } }

  /* het schermpje: som, digitale tijd, bedrag */
  .scherm-card { display: flex; justify-content: center; }
  .scherm {
    font-family: Fredoka, sans-serif;
    font-size: clamp(32px, 9.5vw, 48px);
    letter-spacing: .04em;
    background: var(--screen);
    color: var(--screen-ink);
    border-radius: 22px;
    padding: 16px 28px;
    font-variant-numeric: tabular-nums;
    border: 4px solid var(--line);
    text-align: center;
  }

  .question {
    font-family: Fredoka, sans-serif;
    font-size: clamp(19px, 5vw, 24px);
    text-align: center;
    margin: 0;
  }
  #game { display: flex; flex-direction: column; gap: 20px; }
  .qbox { display: flex; flex-direction: column; gap: 6px; }
  .subq {
    font-family: Nunito, sans-serif;
    font-size: 15px;
    text-align: center;
    color: var(--ink-soft);
    margin: 0;
  }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt {
    font-family: Fredoka, sans-serif;
    font-size: clamp(17px, 4.6vw, 22px);
    background: var(--card);
    color: var(--ink);
    border: 3px solid var(--line);
    border-radius: 20px;
    padding: 16px 10px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .1s;
    font-variant-numeric: tabular-nums;
  }
  .opt:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
  .opt:disabled { cursor: default; }
  .opt.pick-good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .opt.pick-bad  { background: var(--bad-bg);  border-color: var(--bad);  color: var(--bad); }
  .opt.reveal    { border-color: var(--good); color: var(--good); }

  /* zelf intypen */
  .typen { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .veld {
    display: flex; align-items: center; gap: 4px;
    background: var(--screen);
    border: 4px solid var(--line);
    border-radius: 22px;
    padding: 10px 20px;
    font-family: Fredoka, sans-serif;
    font-size: clamp(32px, 10vw, 46px);
    color: var(--screen-ink);
  }
  .veld input {
    width: 2.6ch;
    text-align: center;
    background: transparent;
    border: none;
    color: var(--screen-ink);
    font: inherit;
    font-variant-numeric: tabular-nums;
    padding: 0;
  }
  .veld input::placeholder { color: #3C5573; }
  .veld input:disabled { opacity: .8; }

  .feedback {
    min-height: 30px;
    text-align: center;
    font-family: Fredoka, sans-serif;
    font-size: 18px;
  }
  .feedback.good { color: var(--good); }
  .feedback.bad  { color: var(--bad); }
  .feedback small { display: block; font-family: Nunito, sans-serif; font-size: 14px; color: var(--ink-soft); }

  .big-btn {
    font-family: Fredoka, sans-serif;
    font-size: 20px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 22px;
    padding: 18px;
    width: 100%;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .1s;
  }
  .big-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
  .big-btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
  .big-btn.stil { background: var(--card); color: var(--ink); border: 3px solid var(--line); }

  .result {
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 28px;
    padding: 26px 18px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .result h2 { font-family: Fredoka, sans-serif; margin: 0; font-size: 26px; }
  .result .stars { font-size: 40px; letter-spacing: 4px; }
  .result .big-score {
    font-family: Fredoka, sans-serif;
    font-size: 52px;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .result p { margin: 0; color: var(--ink-soft); }
  .review { text-align: left; display: flex; flex-direction: column; gap: 8px; }
  .review h3 { font-family: Fredoka, sans-serif; font-size: 17px; margin: 6px 0 0; color: var(--ink); }
  .rv {
    background: var(--bad-bg);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .rv b { font-family: Fredoka, sans-serif; font-weight: normal; font-size: 15px; color: var(--ink); }
  .rv .jouw { color: var(--bad); text-decoration: line-through; }
  .rv .juist { color: var(--good); }
  .rv em { font-style: normal; font-size: 14px; color: var(--ink-soft); }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .hand { transition: none; }
    svg.monster { animation: none; }
    .confetti { display: none; }
  }
  @media (max-width: 360px) { .options { grid-template-columns: 1fr; } }
</style>

<div class="wrap">
  <header>
    <h1 id="kop">Oefen<span class="tick">kampioen</span></h1>
    <button class="icon-btn" id="soundBtn" aria-label="Geluid aan of uit">&#128266;</button>
  </header>

  <div id="startScherm">
    <div class="naamkaart">
      <label for="naam">Hoe heet jij?</label>
      <input id="naam" type="text" maxlength="16" placeholder="Typ je naam" autocomplete="given-name">
    </div>
    <div class="naamkaart" role="group" aria-label="Aantal vragen per toets">
      <span class="kaartlabel">Hoeveel vragen?</span>
      <span class="aantallen" id="aantallen"></span>
    </div>
    <div class="naamkaart" role="group" aria-label="Oefenen op tempo">
      <span class="kaartlabel">Op tempo?</span>
      <span class="aantallen" id="tempoKnop"></span>
    </div>
    <p class="lead" id="lead"></p>
    <div class="menu" id="spellen"></div>
  </div>

  <div id="menuScherm" hidden>
    <div class="scorebar">
      <button class="icon-btn" id="terugBtn" aria-label="Terug naar de spellen">&#127968;</button>
      <span class="titel" id="spelTitel"></span>
    </div>
    <p class="lead" id="spelLead"></p>
    <div class="menu" id="menu"></div>
  </div>

  <div id="game" hidden>
    <div class="scorebar">
      <button class="icon-btn" id="homeBtn" aria-label="Terug naar de hoofdstukken">&#127968;</button>
      <span class="titel" id="hfdTitel"></span>
      <span class="score-badge" id="scoreBadge">0 / 10</span>
    </div>
    <div class="dots" id="dots" role="list" aria-label="Voortgang van je toets"></div>
    <div class="tempobalk" id="tempobalk" hidden><span id="tempovulling"></span></div>

    <div class="doek" id="doekCard">
      <div id="doek"></div>
      <div class="party" id="party"></div>
    </div>

    <div class="scherm-card" id="schermCard" hidden><span class="scherm" id="scherm"></span></div>

    <div class="qbox">
      <p class="question" id="question"></p>
      <p class="subq" id="subq" hidden></p>
    </div>

    <div class="options" id="options"></div>

    <div class="typen" id="typen" hidden>
      <div class="veld" id="veld"></div>
      <button class="big-btn" id="checkBtn">Controleer</button>
    </div>

    <p class="feedback" id="feedback" aria-live="polite"></p>
    <button class="big-btn" id="nextBtn">Volgende vraag</button>
  </div>

  <div class="result" id="result" hidden>
    <div class="stars" id="stars">&#11088;</div>
    <h2 id="resultTitle">Goed gedaan!</h2>
    <div class="big-score" id="resultScore">0 / 10</div>
    <p id="resultMsg"></p>
    <div class="review" id="review" hidden></div>
    <button class="big-btn" id="againBtn">&#128257; Nog een toets</button>
    <button class="big-btn stil" id="menuBtn">&#127968; Naar de hoofdstukken</button>
  </div>
</div>

<script>
(function () {
  /* ==================== gereedschap ==================== */
  // meer dan twintig vragen houdt een kind van acht niet vol
  var AANTALLEN = [10, 15, 20];
  var $ = function (id) { return document.getElementById(id); };
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  // maakt van een juist antwoord en drie afleiders vier keuzes in willekeurige volgorde
  function keuzes(juist, fout) {
    return shuffle(fout.concat([juist])).map(function (t) {
      return { text: String(t), ok: String(t) === String(juist) };
    });
  }
  // vult een lijst afleiders aan tot er drie zijn, zonder dubbels en zonder het juiste antwoord
  function vulAan(lijst, juist, kandidaten, geldig) {
    kandidaten.forEach(function (k) {
      if (lijst.length < 3 && String(k) !== String(juist) && lijst.indexOf(k) === -1 &&
          (!geldig || geldig(k))) lijst.push(k);
    });
    return lijst;
  }

  function positief(k) { return k > 0; }
  // vult aan met de buren van het juiste antwoord tot er drie afleiders staan
  function vulRondom(lijst, juist, stap, geldig) {
    for (var d = stap; lijst.length < 3 && d < stap * 200; d += stap) {
      vulAan(lijst, juist, [juist + d, juist - d], geldig || positief);
    }
    return lijst;
  }
  // n andere uit een lijst, het juiste antwoord niet meegerekend
  function andere(lijst, juist, n) {
    return shuffle(lijst.filter(function (x) { return x !== juist; })).slice(0, n);
  }
  function hoofdletter(t) { return t.charAt(0).toUpperCase() + t.slice(1); }

  /* ==================== de spellen ==================== */
  var SPELLEN = [];


  /* -------------------- klokkijken -------------------- */
  (function () {
    // "over" is standaardtaal in het hele taalgebied; "na" is in Belgie gebruikelijk maar
    // Taaladvies noemt de status ervan onduidelijk, dus voor een toets kiezen we "over".
    var WOORD = { 5: 'vijf', 10: 'tien' };
    function nextHour(h) { return h === 12 ? 1 : h + 1; }
    function prevHour(h) { return h === 1 ? 12 : h - 1; }
    function label(h, m) {
      if (m === 0) return h + ' uur';
      if (m === 15) return 'kwart over ' + h;
      if (m === 30) return 'half ' + nextHour(h);
      if (m === 45) return 'kwart voor ' + nextHour(h);
      if (m < 15) return WOORD[m] + ' over ' + h;
      if (m < 30) return WOORD[30 - m] + ' voor half ' + nextHour(h);
      if (m < 45) return WOORD[m - 30] + ' over half ' + nextHour(h);
      return WOORD[60 - m] + ' voor ' + nextHour(h);
    }
    function fmt24(h, m) { return pad2(h) + ':' + pad2(m); }
    function wijzerUur(u) { return u % 12 || 12; }

    // Zes dagdelen zoals ze in Belgie gebruikt worden, volgens Team Taaladvies. Middag stopt
    // hier op 14 uur zodat middag en namiddag niet overlappen: een toets kan geen twee juiste
    // antwoorden hebben. GRENZEN is de enige plaats waar de uren staan.
    var DEELEN = ['Nacht', 'Ochtend', 'Voormiddag', 'Middag', 'Namiddag', 'Avond'];
    var GRENZEN = [0, 6, 9, 12, 14, 18];
    function deelVan(u) {
      for (var i = GRENZEN.length - 1; i >= 0; i--) if (u >= GRENZEN[i]) return DEELEN[i];
    }
    // Ochtend en voormiddag overlappen in het gewone taalgebruik, net als middag en namiddag.
    // Die mogen nooit samen als keuze verschijnen.
    var OVERLAP = { Ochtend: ['Voormiddag'], Voormiddag: ['Ochtend'], Middag: ['Namiddag'], Namiddag: ['Middag'] };
    var DUIDELIJK = {
      Nacht: [1, 2, 3, 4], Ochtend: [7, 8], Voormiddag: [10, 11],
      Middag: [12, 13], Namiddag: [15, 16, 17], Avond: [19, 20, 21]
    };
    // 's morgens dekt ochtend en voormiddag, 's middags dekt middag en namiddag: de marker pint
    // het uur vast zonder het gevraagde dagdeel weg te geven.
    function dagdeelTekst(u) {
      var marker = u < 6 ? '’s nachts' : u < 12 ? '’s morgens' : u < 18 ? '’s middags' : '’s avonds';
      return wijzerUur(u) + ' uur ' + marker;
    }
    function bereikTekst(deel) {
      var i = DEELEN.indexOf(deel);
      var tot = i + 1 < GRENZEN.length ? GRENZEN[i + 1] : 24;

    SPELLEN.push({

        // dubbels weg: bij een symmetrische vorm valt een gedraaide soms samen met de spiegeling
        var gezien = {}, uniek = [];

  /* <<<SPEL>>> */

  /* ==================== naam, aantal en opslag ==================== */
  // alleen letters, spaties, koppeltekens en apostrofs, zodat de naam veilig in een bericht past
  function schoonNaam(t) {
    var uit = '';
    String(t || '').slice(0, 40).split('').forEach(function (c) {
      var isLetter = c.toLowerCase() !== c.toUpperCase();
      if (isLetter || c === ' ' || c === "'" || c === '-') uit += c;
    });
    return uit.trim().slice(0, 16);
  }
  function naam() {
    try { return schoonNaam(localStorage.getItem('oefenkampioen-naam')); } catch (e) { return ''; }
  }
  function zetNaam(t) {
    try { localStorage.setItem('oefenkampioen-naam', schoonNaam(t)); } catch (e) { /* zonder opslag werkt het gewoon */ }
  }
  // de %-plaats wordt de naam met komma, of niets als er geen naam ingevuld is
  function metNaam(sjabloon) {
    var n = naam();
    return sjabloon.replace('%', n ? ', ' + n : '');
  }
  var LOF = ['Juist%! 🎉', 'Super%! 🌟', 'Knap gedaan%! 👏', 'Helemaal goed%! ✅'];
  var MOED = ['Bijna%!', 'Dat lukt de volgende keer%!', 'Goed geprobeerd%!', 'Kijk nog eens goed%!'];
  function leesAantal() {
    var a;
    try { a = parseInt(localStorage.getItem('oefenkampioen-aantal'), 10); } catch (e) { a = NaN; }
    return AANTALLEN.indexOf(a) > -1 ? a : AANTALLEN[0];
  }
  // hoeveel seconden een vraag mag duren als het op tempo staat. Tafels moeten er het snelst
  // uit: automatiseren betekent niet uitrekenen. De andere spellen vragen eerst lezen en kijken.
  var TEMPO = { maal: 8, klok: 25, winkel: 30, maten: 25, kalender: 20, brug: 25, spiegel: 35 };
  function secondenVoor(spel) { return TEMPO[spel.id] || 25; }
  function leesTempo() {
    try { return localStorage.getItem('oefenkampioen-tempo') === 'aan'; } catch (e) { return false; }
  }
  function zetTempo(aan) {
    state.tempo = aan;
    try { localStorage.setItem('oefenkampioen-tempo', aan ? 'aan' : 'uit'); } catch (e) { /* mag mislukken */ }
  }
  function stopKlok() {
    if (state.klok) clearTimeout(state.klok);
    state.klok = null;
    $('tempobalk').hidden = true;
  }
  function startKlok() {
    if (!state.tempo) return;
    var sec = secondenVoor(state.spel), balk = $('tempovulling');
    $('tempobalk').hidden = false;
    // de animatie opnieuw laten beginnen lukt alleen door ze eerst weg te halen
    balk.style.animation = 'none';
    void balk.offsetWidth;
    balk.style.animation = 'leeglopen ' + sec + 's linear forwards';
    state.klok = setTimeout(function () { antwoord(null, 'te traag', false); }, sec * 1000);
  }

  function zetAantal(a) {
    state.aantal = a;
    try { localStorage.setItem('oefenkampioen-aantal', String(a)); } catch (e) { /* mag mislukken */ }
  }
  function lees() {
    try { return JSON.parse(localStorage.getItem('oefenkampioen-beste') || '{}'); } catch (e) { return {}; }
  }
  function bewaar(sleutel, score, van) {
    try {
      var b = lees(), oud = b[sleutel];
      // vergelijken op verhouding, want een toets kan 10, 15 of 20 vragen tellen
      if (!oud || !oud.van || score / van > oud.score / oud.van) {
        b[sleutel] = { score: score, van: van };
        localStorage.setItem('oefenkampioen-beste', JSON.stringify(b));
      }
    } catch (e) { /* zonder opslag werkt de app gewoon verder */ }
  }

  /* ==================== toestand ==================== */
  var state = {
    spel: null, hfd: 0, aantal: 10, q: 0, score: 0, results: [], fouten: [],
    current: null, answered: false, sound: true, tempo: false, klok: null,
    plan: [], decks: {}

  var ac = null;

  /* ==================== geluid en confetti ==================== */
  function tone(freq, start, dur) {
    var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + start;
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function beep(ok) {
    if (!state.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ok) { tone(660, 0, 0.15); tone(990, 0.12, 0.25); } else { tone(196, 0, 0.3); }
    } catch (e) { /* geluid is extra, nooit blokkerend */ }
  }
  function party() {
    if (reduced) return;
    var box = $('party'), soorten = ['⭐', '🎉', '✨', '🌟', '🎈'];
    for (var i = 0; i < 15; i++) {
      var s = document.createElement('span');
      s.className = 'confetti';
      s.textContent = soorten[Math.floor(Math.random() * soorten.length)];
      s.style.left = (6 + Math.random() * 88) + '%';
      s.style.animationDelay = (Math.random() * 0.3).toFixed(2) + 's';
      box.appendChild(s);
      setTimeout(function (el) { return function () { el.remove(); }; }(s), 1700);
    }
  }

  /* ==================== de toets ==================== */
  // het plan van een hoofdstuk staat op tien vragen; schaal het naar het gekozen aantal
  function planVoor(h, n) {
    var soorten = Object.keys(h.plan), uit = {}, som = 0;
    soorten.forEach(function (soort) {
      uit[soort] = Math.max(1, Math.round(h.plan[soort] / 10 * n));
      som += uit[soort];
    });
    var grootste = soorten.slice().sort(function (a, b) { return uit[b] - uit[a]; })[0];
    uit[grootste] += n - som;
    return uit;
  }
  function bouwToets() {
    var h = state.spel.hoofdstukken[state.hfd];
    var verdeling = planVoor(h, state.aantal);
    var plan = [];
    state.decks = {};
    Object.keys(verdeling).forEach(function (soort) {
      state.decks[soort] = shuffle(state.spel.zaadjes(soort, h));
      for (var i = 0; i < verdeling[soort]; i++) plan.push(soort);
    });
    state.plan = shuffle(plan);
  }
  function maakVraag(soort) {
    var h = state.spel.hoofdstukken[state.hfd];
    return state.spel.maak(soort, state.decks[soort].pop(), h);
  }

  /* ==================== schermen ==================== */
  function lead() {
    var n = naam();
    return (n ? 'Hoi ' + n + '! ' : '') + 'Kies een spel. Elke toets telt ' +
      state.aantal + ' vragen en ' + state.aantal + ' punten.' +
      (state.tempo ? ' De klok loopt mee: te traag telt als fout.' : '');

  function kaart(ico, nr, titel, tekst, beste, badge) {
    var b = beste && beste.van ? '<span class="beste">beste ' + beste.score + '/' + beste.van + '</span>' : '';
    return '<span class="ico">' + ico + '</span>' +
      '<span class="tekst"><h2>' + (nr ? nr + '. ' : '') + titel + '</h2><p>' + tekst + '</p></span>' +
      b + (badge ? '<span class="badge ' + badge + '">' + badge + '</span>' : '');
  }
  function toonStart() {
    var beste = lees();
    $('spellen').innerHTML = SPELLEN.map(function (s, i) {
      // op de spelkaart staat het beste hoofdstukresultaat van dat spel
      var top = null;
      s.hoofdstukken.forEach(function (h, k) {
        var b = beste[s.id + ':' + k];
        if (b && b.van && (!top || b.score / b.van > top.score / top.van)) top = b;
      });
      return '<button class="hfd" data-i="' + i + '">' + kaart(s.ico, 0, s.naam, s.tekst, top, '') + '</button>';
    }).join('');
    Array.prototype.forEach.call($('spellen').children, function (b) {
      b.onclick = function () { toonMenu(SPELLEN[Number(b.dataset.i)]); };
    });
    $('naam').value = naam();
    $('aantallen').innerHTML = AANTALLEN.map(function (a) {
      return '<button class="aantal" data-a="' + a + '" aria-pressed="' + (a === state.aantal) + '">' + a + '</button>';
    }).join('');
    Array.prototype.forEach.call($('aantallen').children, function (b) {
      b.onclick = function () { zetAantal(Number(b.dataset.a)); toonStart(); };
    });
    $('tempoKnop').innerHTML = [false, true].map(function (aan) {
      return '<button class="aantal" data-t="' + aan + '" aria-pressed="' + (aan === state.tempo) + '">' +
        (aan ? 'ja, met klok' : 'nee, rustig') + '</button>';
    }).join('');
    Array.prototype.forEach.call($('tempoKnop').children, function (b) {
      b.onclick = function () { zetTempo(b.dataset.t === 'true'); toonStart(); };
    });
    $('lead').textContent = lead();
    $('kop').innerHTML = 'Oefen<span class="tick">kampioen</span>';
    $('startScherm').hidden = false;
    $('menuScherm').hidden = true;
    $('game').hidden = true;
    $('result').hidden = true;
  }
  function toonMenu(spel) {
    stopKlok();
    state.spel = spel;
    var beste = lees();
    $('menu').innerHTML = spel.hoofdstukken.map(function (h, i) {
      return '<button class="hfd" data-i="' + i + '">' +
        kaart(h.ico, i + 1, h.titel, h.tekst, beste[spel.id + ':' + i], h.badge) + '</button>';
    }).join('');
    Array.prototype.forEach.call($('menu').children, function (b) {
      b.onclick = function () { startHoofdstuk(Number(b.dataset.i)); };
    });
    $('kop').innerHTML = spel.ico + ' ' + spel.naam;
    $('spelTitel').textContent = spel.naam;
    $('spelLead').textContent = 'Kies een hoofdstuk. Elke toets telt ' + state.aantal + ' vragen.';
    $('startScherm').hidden = true;
    $('menuScherm').hidden = false;
    $('game').hidden = true;
    $('result').hidden = true;
  }
  function startHoofdstuk(i) {
    stopKlok();
    state.hfd = i;
    state.q = 0;
    state.score = 0;
    state.results = [];
    state.fouten = [];
    bouwToets();
    $('hfdTitel').textContent = state.spel.hoofdstukken[i].titel;
    $('menuScherm').hidden = true;
    $('result').hidden = true;
    $('game').hidden = false;
    volgendeVraag();
  }

  function drawDots() {
    var html = '';
    for (var i = 0; i < state.aantal; i++) {
      var cls = 'dot';
      if (state.results[i] === true) cls += ' good';
      else if (state.results[i] === false) cls += ' bad';
      else if (i === state.q) cls += ' now';
      var stand = state.results[i] === true ? 'juist' : state.results[i] === false ? 'fout' : i === state.q ? 'bezig' : 'nog te doen';
      html += '<span class="' + cls + '" title="Vraag ' + (i + 1) + ': ' + stand + '">' + (i + 1) + '</span>';
    }
    // tot tien vragen op een rij, daarboven twee even lange rijen
    var kolommen = state.aantal <= 10 ? state.aantal : Math.ceil(state.aantal / 2);
    $('dots').style.gridTemplateColumns = 'repeat(' + kolommen + ', 1fr)';
    $('dots').innerHTML = html;
    $('scoreBadge').textContent = state.score + ' / ' + state.aantal;
  }

  function volgendeVraag() {
    var spel = state.spel;
    var v = state.current = maakVraag(state.plan[state.q]);
    state.answered = false;

    $('doek').innerHTML = spel.teken(v) || '';
    $('doekCard').hidden = !$('doek').innerHTML;
    var sch = spel.scherm ? spel.scherm(v) : null;
    $('scherm').textContent = sch || '';
    $('schermCard').hidden = !sch;

    var tekst = spel.vraag(v, state.q + 1);
    $('question').textContent = tekst.titel;
    $('subq').textContent = tekst.sub || '';
    $('subq').hidden = !tekst.sub;

    $('options').hidden = !v.options;
    $('typen').hidden = !v.typen;
    if (v.options) {
      $('options').innerHTML = '';
      v.options.forEach(function (o, i) {
        var b = document.createElement('button');
        b.className = 'opt';
        b.id = 'opt' + i;
        b.textContent = o.text;
        b.onclick = function () { antwoord(b, o.text, o.ok); };
        $('options').appendChild(b);
      });
    }
    if (v.typen) {
      $('veld').innerHTML = v.typen.velden.map(function (f, i) {
        return (i ? '<span>' + v.typen.scheider + '</span>' : '') +
          '<input id="in' + i + '" type="text" inputmode="numeric" maxlength="' + (f.max || 2) +
          '" placeholder="' + f.ph + '" aria-label="' + f.aria + '">';
      }).join('');
      v.typen.velden.forEach(function (f, i) {
        var el = $('in' + i);
        el.onkeydown = function (e) { if (e.key === 'Enter') controleer(); };
        el.oninput = function () {
          if (el.value.length === (f.max || 2) && $('in' + (i + 1))) $('in' + (i + 1)).focus();
        };
      });
      $('checkBtn').disabled = false;
    }
    if (spel.na) spel.na(v);
    startKlok();

    $('feedback').textContent = '';
    $('feedback').className = 'feedback';
    $('nextBtn').disabled = true;
    $('nextBtn').textContent = v.typen ? 'Typ eerst een antwoord' : 'Kies eerst een antwoord';
    drawDots();
  }

  function antwoord(btn, tekst, ok) {
    if (state.answered) return;
    state.answered = true;
    stopKlok();
    var v = state.current, fb = $('feedback');

    if (v.options) {
      Array.prototype.forEach.call($('options').children, function (b, i) {
        b.disabled = true;
        if (v.options[i].ok && b !== btn) b.classList.add('reveal');
      });
      if (btn) btn.classList.add(ok ? 'pick-good' : 'pick-bad');
    }
    if (state.spel.reactie) state.spel.reactie(v, ok);

    var uitleg = state.spel.uitleg(v);
    if (ok) {
      state.score++;
      state.results[state.q] = true;
      fb.className = 'feedback good';
      fb.innerHTML = metNaam(LOF[Math.floor(Math.random() * LOF.length)]) + '<small>' + uitleg + '</small>';
      party();
      beep(true);
    } else {
      state.results[state.q] = false;
      state.fouten.push({ vraag: state.spel.kort(v), jouw: tekst, juist: v.ans });
      fb.className = 'feedback bad';
      fb.innerHTML = metNaam(MOED[Math.floor(Math.random() * MOED.length)]) +
        ' Het juiste antwoord is ' + v.ans + '.<small>' + uitleg + '</small>';
      beep(false);
    }

    state.q++;
    drawDots();
    $('nextBtn').disabled = false;
    $('nextBtn').textContent = state.q >= state.aantal ? '🏁 Bekijk je punten' : 'Volgende vraag';
  }

  function controleer() {
    if (state.answered) return;
    var v = state.current, waarden = [], goed = true;
    for (var i = 0; i < v.typen.velden.length; i++) {
      var n = parseInt($('in' + i).value, 10);
      if (isNaN(n) || n < 0 || n > 9999) {
        $('feedback').className = 'feedback bad';
        $('feedback').textContent = v.typen.hulp || 'Vul elk vakje in met een getal.';
        return;
      }
      waarden.push(n);
      if (n !== v.typen.velden[i].ant) goed = false;
    }
    v.typen.velden.forEach(function (f, i) { $('in' + i).disabled = true; });
    $('checkBtn').disabled = true;
    var getypt = waarden.map(function (n, i) {
      var f = v.typen.velden[i];
      return f.pad ? pad2(n) : String(n);
    }).join(v.typen.scheider);
    antwoord(null, getypt, goed);
  }

  /* ==================== resultaat ==================== */
  function toonResultaat() {
    var s = state.score;
    bewaar(state.spel.id + ':' + state.hfd, s, state.aantal);
    var deel = s / state.aantal;
    $('stars').textContent = deel >= 0.9 ? '⭐⭐⭐' : deel >= 0.7 ? '⭐⭐' : deel >= 0.5 ? '⭐' : '💪';
    $('resultTitle').textContent = metNaam(deel >= 0.7 ? 'Goed gedaan%!' : 'Volgende keer beter%!');
    $('resultScore').textContent = s + ' / ' + state.aantal;
    $('resultMsg').textContent = deel >= 0.9 ? (state.spel.top || 'Jij bent een echte kampioen!')
      : deel >= 0.7 ? 'Mooi werk. Nog een keer en je haalt alles juist.'
      : deel >= 0.5 ? 'Goed bezig. Blijf oefenen, je bent er bijna.'
      : 'Oefenen maakt sterk. Probeer eerst een makkelijker hoofdstuk.';
    if (state.fouten.length) {
      $('review').innerHTML = '<h3>Deze mag je nog eens bekijken</h3>' + state.fouten.map(function (f) {
        return '<div class="rv"><b>' + f.vraag + '</b><em><span class="jouw">' + f.jouw +
          '</span> wordt <span class="juist">' + f.juist + '</span></em></div>';
      }).join('');
      $('review').hidden = false;
    } else {
      $('review').hidden = true;
    }
    $('game').hidden = true;
    $('result').hidden = false;
  }

  /* ==================== knoppen ==================== */
  $('nextBtn').onclick = function () {
    if (state.q >= state.aantal) toonResultaat(); else volgendeVraag();
  };
  $('checkBtn').onclick = controleer;
  $('againBtn').onclick = function () { startHoofdstuk(state.hfd); };
  $('menuBtn').onclick = function () { toonMenu(state.spel); };
  $('homeBtn').onclick = function () { toonMenu(state.spel); };
  $('terugBtn').onclick = toonStart;
  $('naam').oninput = function () { zetNaam($('naam').value); $('lead').textContent = lead(); };
  $('soundBtn').onclick = function () {
    state.sound = !state.sound;
    $('soundBtn').textContent = state.sound ? '🔊' : '🔇';
  };

  state.aantal = leesAantal();
  state.tempo = leesTempo();
  toonStart();

  /* ==================== zelfcheck: open met #test in de adresbalk ==================== */
  if (location.hash === '#test') {
    var fouten = 0;
    var check = function (ok, wat) { if (!ok) { fouten++; console.error('FOUT: ' + wat); } };

    check(schoonNaam('  Sam  ') === 'Sam', 'naam wordt opgekuist');
    check(schoonNaam('<img src=x>') === 'img srcx', 'tekens die markup maken verdwijnen uit de naam');
    check(schoonNaam('Jean-Luc') === 'Jean-Luc', 'koppeltekens blijven');
    check(schoonNaam('abcdefghijklmnopqrstuvwxyz').length === 16, 'de naam wordt afgekapt');
    check(metNaam('Bijna%!') === 'Bijna!' || naam() !== '', 'zonder naam blijft het bericht kloppen');
    LOF.concat(MOED).forEach(function (t) {
      check(t.indexOf('%') > -1, 'elk bericht heeft een plaats voor de naam: ' + t);
      check(t.replace('%', '').indexOf('  ') === -1, 'geen dubbele spatie zonder naam: ' + t);
    });
    check(AANTALLEN[0] === 10 && AANTALLEN[AANTALLEN.length - 1] === 20, 'van tien tot twintig vragen');
    check(SPELLEN.length > 0, 'er staat minstens een spel in');
    check(leesTempo() === false || leesTempo() === true, 'de tempo-schakelaar leest een ja of een nee');
    var ids = SPELLEN.map(function (s) { return s.id; });
    check(ids.filter(function (x, i) { return ids.indexOf(x) === i; }).length === ids.length, 'elk spel heeft een eigen id');

    var toetsen = 0;
    var bewaardAantal = state.aantal, bewaardSpel = state.spel, bewaardHfd = state.hfd;
    SPELLEN.forEach(function (spel) {
      state.spel = spel;
      ['ico', 'naam', 'tekst', 'zaadjes', 'maak', 'teken', 'vraag', 'uitleg', 'kort'].forEach(function (k) {
        check(spel[k] !== undefined, spel.id + ' heeft ' + k);
      });
      // een icoon is een teken of twee; staat er meer, dan is een escape blijven staan als tekst
      check(spel.ico.length <= 4, spel.id + ': het spelicoon is geen echt teken (' + spel.ico + ')');
      var sec = secondenVoor(spel);
      check(sec >= 5 && sec <= 60, spel.id + ': de tempotijd is bruikbaar (' + sec + 's)');
      check(TEMPO[spel.id], spel.id + ': heeft een eigen tempotijd, niet de standaard');
      spel.hoofdstukken.forEach(function (h, i) {
        check(h.ico.length <= 4, spel.id + ' hoofdstuk ' + (i + 1) + ': het icoon is geen echt teken (' + h.ico + ')');
      });
      if (spel.test) spel.test(check);

      AANTALLEN.forEach(function (aantal) {
        state.aantal = aantal;
        spel.hoofdstukken.forEach(function (h, i) {
          var verdeling = planVoor(h, aantal), som = 0;
          Object.keys(verdeling).forEach(function (k) {
            som += verdeling[k];
            check(verdeling[k] >= 1, spel.id + ' hoofdstuk ' + (i + 1) + ': elk vraagtype komt voor bij ' + aantal);
            check(spel.zaadjes(k, h).length >= verdeling[k],
              spel.id + ' hoofdstuk ' + (i + 1) + ': genoeg verschillende vragen voor ' + k + ' bij ' + aantal);
          });
          check(som === aantal, spel.id + ' hoofdstuk ' + (i + 1) + ' telt ' + aantal + ' vragen (nu ' + som + ')');

          for (var ronde = 0; ronde < 5; ronde++) {
            state.hfd = i;
            bouwToets();
            var gezien = {}, vorige = null;
            for (var q = 0; q < state.aantal; q++) {
              var v = maakVraag(state.plan[q]);
              var sl = v.sleutel;
              check(!!sl, spel.id + ': elke vraag heeft een sleutel om dubbels te herkennen');
              check(!gezien[sl], spel.id + ' hoofdstuk ' + (i + 1) + ': dezelfde vraag twee keer (' + sl + ')');
              check(sl !== vorige, spel.id + ' hoofdstuk ' + (i + 1) + ': twee keer na elkaar dezelfde vraag');
              gezien[sl] = 1;
              vorige = sl;
              check(typeof v.ans === 'string' && v.ans.length > 0, spel.id + ': elk antwoord is ingevuld');
              check(typeof spel.teken(v) === 'string', spel.id + ': elke vraag heeft een tekening');
              check(spel.teken(v).indexOf('undefined') === -1, spel.id + ': geen undefined in de tekening');
              var t = spel.vraag(v, q + 1);
              check(t && t.titel && t.titel.indexOf('undefined') === -1, spel.id + ': elke vraag heeft een tekst');
              check(spel.uitleg(v).indexOf('undefined') === -1, spel.id + ': elke uitleg is volledig');
              check(spel.kort(v).indexOf('undefined') === -1, spel.id + ': elke korte tekst is volledig');

              if (v.options) {
                check(v.options.length === 4, spel.id + ': vier keuzes');
                check(v.options.filter(function (o) { return o.ok; }).length === 1, spel.id + ': precies een juist antwoord');
                var tt = v.options.map(function (o) { return o.text; });
                check(tt.filter(function (x, k) { return tt.indexOf(x) === k; }).length === 4, spel.id + ': vier verschillende keuzes');
                check(tt.indexOf(v.ans) > -1, spel.id + ': het juiste antwoord staat erbij');
              } else {
                check(!!v.typen, spel.id + ': een vraag zonder keuzes laat typen');
                check(v.typen.velden.length >= 1, spel.id + ': minstens een invulvakje');
                var getypt = v.typen.velden.map(function (f) {
                  check(typeof f.ant === 'number' && f.ant >= 0, spel.id + ': elk vakje heeft een antwoord');
                  return f.pad ? pad2(f.ant) : String(f.ant);
                }).join(v.typen.scheider);
                check(getypt === v.ans, spel.id + ': de vakjes samen geven het antwoord (' + getypt + ' vs ' + v.ans + ')');
              }
            }
            toetsen++;
          }
        });
      });
    });
    state.aantal = bewaardAantal;
    state.spel = bewaardSpel;
    state.hfd = bewaardHfd;

    toonStart();
    console.log(fouten === 0
      ? 'Zelfcheck klaar: ' + SPELLEN.length + ' spellen, ' + toetsen + ' toetsen doorgerekend, geen fouten.'
      : 'Zelfcheck klaar: ' + fouten + ' fouten gevonden.');
  }
})();
</script>
